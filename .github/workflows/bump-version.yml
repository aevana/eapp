name: Bump Version on Push

on:
  push:
    branches:
      - '**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Skip if this commit was already made by the workflow
    if: "!contains(github.event.head_commit.message, '[skip version bump]')"

    steps:
      # TEMPORARY diagnostic: reports on PAT_TOKEN without printing it. Remove after debugging.
      - name: Diagnose PAT_TOKEN
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then echo "PAT_TOKEN: EMPTY (secret not available to this run)"; exit 0; fi
          echo "PAT_TOKEN: set, length ${#PAT}"
          case "$PAT" in
            ghp_*) echo "type: classic (ghp_ prefix)";;
            github_pat_*) echo "type: fine-grained (github_pat_ prefix)";;
            *) echo "type: unrecognised prefix";;
          esac
          if [ "$PAT" != "$(printf '%s' "$PAT" | tr -d '[:space:]')" ]; then echo "WARNING: value contains whitespace or newlines"; fi
          echo "GET /user -> HTTP $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $PAT" https://api.github.com/user)"
          echo "GET /repos/aevana/eapp -> HTTP $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $PAT" https://api.github.com/repos/aevana/eapp)"
          echo "GET /repos/aevana/eapp/contents -> HTTP $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $PAT" https://api.github.com/repos/aevana/eapp/contents/public/version.txt)"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Read current version
        id: read_version
        run: |
          VERSION=$(cat public/version.txt | tr -d '[:space:]')
          echo "current=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ steps.read_version.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if echo "$COMMIT_MSG" | grep -qiE "BREAKING CHANGE|MAJOR UPDATE"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qiE "\b(feat|add|adds|new)\b"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > public/version.txt
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push updated version
        run: |
          git config user.name "aevana"
          git config user.email "aevana@users.noreply.github.com"
          git add public/version.txt
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} [skip version bump]"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/aevana/eapp.git HEAD:${{ github.ref_name }}
